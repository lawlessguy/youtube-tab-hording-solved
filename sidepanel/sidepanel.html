<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="panel">
    <div class="sticky-top">
      <!-- Header: Watch Time + Refresh -->
      <header>
        <div class="watch-bar">
          <span>Today: <b id="watch-today">0m</b></span>
          <span class="sep">&middot;</span>
          <span>Week: <b id="watch-week">0m</b></span>
          <span class="sep">&middot;</span>
          <span>Month: <b id="watch-month">0m</b></span>
          <span class="sep">&middot;</span>
          <span>Year: <b id="watch-year">0m</b></span>
        </div>
        <button class="header-icon-btn" id="panel-mode-toggle" title="Toggle slim mode (thumbnails only &#8212; drag the panel edge to its minimum width for a single-thumbnail rail)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="14" y1="5" x2="14" y2="19"/></svg>
        </button>
        <button class="header-icon-btn" id="refresh-metadata">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
      </header>

      <!-- Session Switcher (no prompt()/confirm() in panels: inline input + two-click confirm) -->
      <div class="session-bar">
        <select id="session-select" class="session-select" title="Active session"></select>
        <input type="text" id="session-name-input" class="session-name-input" style="display:none" maxlength="40" spellcheck="false">
        <button class="session-btn" id="session-new" title="New session">+</button>
        <button class="session-btn" id="session-rename" title="Rename session">&#9998;</button>
        <button class="session-btn" id="session-merge" title="Merge this session into Main">&#8689;</button>
        <button class="session-btn session-btn--danger" id="session-delete" title="Delete session and its videos">&#10005;</button>
      </div>

      <!-- Toggle Bar: All buttons, same size, labeled -->
      <div class="toggle-bar">
        <button class="tb-btn tb-btn--collect" id="collect-tabs" data-desc="Collect all open YouTube tabs into the queue">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="8,17 12,21 16,17"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.88,18.09A5,5,0,0,0,18,9h-1.26A8,8,0,1,0,3,16.29"/></svg>
          <span class="tb-label">Collect</span>
        </button>
        <button class="tb-btn tb-btn--close" id="close-tabs" data-desc="Close YouTube tabs matching visible list">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span class="tb-label">Close</span>
        </button>
        <button class="tb-btn tb-btn--intercept" id="tb-intercept" data-desc="Intercept new YouTube tabs and add to queue">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span class="tb-label">Intercept</span>
        </button>
        <button class="tb-btn" id="tb-autoplay" data-desc="Auto-play next video when current one ends">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/><line x1="19" y1="5" x2="19" y2="19" stroke-width="3"/></svg>
          <span class="tb-label">Autoplay</span>
        </button>
        <button class="tb-btn" id="tb-videoinfo" data-desc="Show views &amp; upload date above YouTube actions bar">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span class="tb-label">Info</span>
        </button>
        <button class="tb-btn" id="tb-hiderecs" data-desc="Hide recommendations &amp; move comments to sidebar">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span class="tb-label">Hide</span>
        </button>
      </div>
      <!-- Toggle Bar row 2 (contract order: Strip / Resize / PiP / Export); hidden while empty -->
      <div class="toggle-bar toggle-bar--secondary">
        <button class="tb-btn" id="tb-inpage" data-desc="Show queue strip in the YouTube top bar">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="6" rx="1"/><line x1="2" y1="14" x2="22" y2="14"/><line x1="2" y1="18" x2="14" y2="18"/></svg>
          <span class="tb-label">Strip</span>
        </button>
        <button class="tb-btn" id="tb-resize" data-desc="Drag the edges of the YouTube player to resize it (double-click a handle to reset)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15,3 21,3 21,9"/><polyline points="9,21 3,21 3,15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          <span class="tb-label">Resize</span>
        </button>
        <button class="tb-btn" id="tb-autopip" data-desc="Auto popup-player when you switch tabs &#8212; opens Chrome's native PiP window (opacity &amp; size presets apply only to the Float player). Chrome decides eligibility; first use shows a Chrome prompt">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><rect x="11" y="11" width="8" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
          <span class="tb-label">PiP</span>
        </button>
        <button class="tb-btn tb-btn--export" id="tb-export" data-desc="Export activity log (watch history events) as a JSON file">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span class="tb-label">Export</span>
        </button>
      </div>
      <div class="toggle-desc" id="toggle-desc">&nbsp;</div>

      <!-- Volume & Speed -->
      <div class="controls-bar">
        <div class="ctrl-row">
          <span class="ctrl-icon clickable" id="volume-reset">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><path d="M15.54,8.46a5,5,0,0,1,0,7.07"/></svg>
          </span>
          <input type="range" id="volume-slider" min="0" max="1000" value="100" step="10" class="slider">
          <span class="ctrl-val" id="volume-value">100%</span>
        </div>
        <div class="ctrl-row">
          <span class="ctrl-icon clickable" id="speed-reset">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </span>
          <input type="range" id="speed-slider" min="1" max="100" value="10" class="slider">
          <span class="ctrl-val" id="speed-value">1.0x</span>
        </div>
        <div class="ctrl-row ctrl-row--pip">
          <span class="ctrl-icon" title="Floating (Float) player &#8212; position can't be preset; Chrome remembers where you last dragged the window">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><rect x="11" y="11" width="8" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
          </span>
          <input type="range" id="pip-opacity-slider" min="30" max="100" value="100" step="5" class="slider" title="Floating (Float) player opacity &#8212; the auto-PiP popup is a native window and can't be dimmed">
          <span class="ctrl-val" id="pip-opacity-value">100%</span>
          <span class="pip-size-btns">
            <button class="pip-size-btn" id="pip-size-small" data-size="small" title="Open floating player at 320&#215;180 (applies on next open; Float window only)">S</button>
            <button class="pip-size-btn active" id="pip-size-medium" data-size="medium" title="Open floating player at 480&#215;270 (applies on next open; Float window only &#8212; position can't be preset, Chrome remembers your last drag)">M</button>
            <button class="pip-size-btn" id="pip-size-large" data-size="large" title="Open floating player at 640&#215;360 (applies on next open; Float window only)">L</button>
          </span>
        </div>
      </div>

      <!-- Shorts tools (visible only when the displayed tab is a Short) -->
      <div class="shorts-tools" id="shorts-tools" style="display:none">
        <button class="st-btn" id="st-prev" data-desc="Previous Short in the active tab">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18,15 12,9 6,15"/></svg>
          <span class="tb-label">Prev</span>
        </button>
        <button class="st-btn" id="st-next" data-desc="Next Short in the active tab">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6,9 12,15 18,9"/></svg>
          <span class="tb-label">Next</span>
        </button>
        <button class="st-btn" id="st-open-panel" data-desc="Watch this Short inside the panel">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><polygon points="10,8 16,12 10,16" fill="currentColor"/></svg>
          <span class="tb-label">Panel</span>
        </button>
        <button class="st-btn st-toggle" id="st-autoscroll" data-desc="Auto-scroll to the next Short when it finishes">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6,11 12,17 18,11"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="tb-label">Auto-next</span>
        </button>
        <button class="st-btn st-toggle" id="st-autoclose" data-desc="Close the Shorts tab when it finishes">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
          <span class="tb-label">Auto-close</span>
        </button>
      </div>

      <!-- Sort + Search -->
      <div class="filter-search-bar">
        <div class="sort-btns">
          <button class="sort-btn active" data-sort="addedAt">Added</button>
          <button class="sort-btn" data-sort="duration">Length</button>
          <button class="sort-btn" data-sort="uploadedAt">Uploaded</button>
          <button class="sort-btn" data-sort="suggested" title="Suggested &#8212; ranked by your watch history">Suggest</button>
          <button class="sort-dir" id="sort-direction">&#8595;</button>
          <button class="star-filter" id="star-filter" title="Show starred only">&#9733;</button>
        </div>
        <div class="search-inline">
          <svg class="search-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search...">
          <button class="search-clear" id="search-clear" style="display:none">
            <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- Channel filter chip (hidden unless a channel filter is active) -->
      <div class="channel-chip" id="channel-chip" style="display:none">
        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        <span class="channel-chip-name" id="channel-chip-name"></span>
        <button class="search-clear" id="channel-chip-clear" title="Clear channel filter">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- Videos / Shorts Tabs -->
      <div class="content-tabs">
        <button class="content-tab active" data-tab="videos" id="tab-videos">Videos (<span id="video-count">0</span>)</button>
        <button class="content-tab" data-tab="shorts" id="tab-shorts">Shorts (<span id="shorts-count">0</span>)</button>
      </div>
    </div>

    <!-- SCROLLABLE CONTENT -->
    <div class="scroll-area">
      <!-- In-panel Shorts player (stage 07) — must stay the FIRST child: the
           virtual scroller re-measures offsetTop under it on open/close -->
      <div id="shorts-player" style="display:none"></div>

      <!-- Now Playing (active video priority slot) -->
      <div id="now-playing" style="display:none"></div>

      <div class="video-list" id="video-list"></div>
      <div class="video-list" id="shorts-list" style="display:none"></div>

      <!-- Watched Section (collapsible, collapsed by default) -->
      <div class="section">
        <div class="section-head collapsible" id="watched-header">
          <span class="collapse-icon collapsed">&#9660;</span>
          <span>Watched (<span id="watched-count">0</span>)</span>
        </div>
        <div class="video-list collapsed" id="watched-list"></div>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
